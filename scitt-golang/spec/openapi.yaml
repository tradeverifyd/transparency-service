openapi: 3.0.3
info:
  title: SCITT Transparency Service API
  description: |
    SCRAPI (SCITT Reference APIs) compliant transparency service for supply chain artifacts.

    This service provides a transparent, verifiable log of signed statements following
    the IETF SCITT specification.
  version: 1.0.0
  contact:
    name: SCITT Transparency Service
    url: https://github.com/scitt-community
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: System
    description: Service definition and health
  - name: SCITT Reference APIs
    description: Scitt reference APIs
  - name: Transparency Log
    description: The append only tiled log and query interfaces

paths:
  /:
    get:
      summary: API Documentation
      description: Swagger UI interface for exploring the API
      tags:
        - System
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  /openapi.json:
    get:
      summary: OpenAPI Specification
      description: OpenAPI 3.0 specification in JSON format
      tags:
        - System
      responses:
        '200':
          description: OpenAPI specification
          content:
            application/json:
              schema:
                type: object
  /health:
    get:
      summary: Health Check
      description: Check if the service is running and healthy
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  issuer:
                    type: string
                    example: "https://transparency.example"
  
  /.well-known/scitt-configuration:
    get:
      summary: Service Configuration
      description: |
        Get the SCITT service configuration including supported algorithms,
        registration policies, and service metadata (per SCRAPI specification).
      tags:
        - SCITT Reference APIs
      responses:
        '200':
          description: Service configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                    description: Service issuer URL
                    example: "https://transparency.example"
                  supported_algorithms:
                    type: array
                    items:
                      type: string
                    description: Supported signing algorithms
                    example: ["ES256"]
                  supported_hash_algorithms:
                    type: array
                    items:
                      type: string
                    description: Supported hash algorithms
                    example: ["SHA-256"]
                  registration_policy:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Registration policy type
                        example: "open"

  /.well-known/scitt-keys:
    get:
      summary: Service Verification Keys
      description: |
        Get the service's verification keys as a COSE Key Set in CBOR format
        (per SCRAPI specification and RFC 9052 Section 7).
      tags:
        - SCITT Reference APIs
      responses:
        '200':
          description: COSE Key Set
          content:
            application/cbor:
              schema:
                type: string
                format: binary
                description: |
                  CBOR-encoded array of COSE_Key structures.
                  Each key includes the COSE key thumbprint (RFC 9679) as the key ID.
        '500':
          description: Failed to generate key set
          content:
            text/plain:
              schema:
                type: string

  /checkpoint:
    get:
      summary: Get Checkpoint Receipt
      description: |
        Get a scitt receipt for the last entry in the transparency log.
      tags:
        - Transparency Log
      responses:
        '200':
          description: Checkpoint receipt retrieved successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=60"
          content:
            application/scitt-receipt+cose:
              schema:
                type: string
                format: binary
                description: CBOR-encoded COSE Sign1 receipt for the last entry
        '500':
          description: Failed to get checkpoint (log may be empty)
          content:
            text/plain:
              schema:
                type: string

  /tile/{level}/{index}:
    get:
      summary: Get Merkle Tree Tile
      description: |
        Get a Merkle tree tile from the transparency log.
        Supports C2SP tlog-tiles format with nested indices.
      tags:
        - Transparency Log
      parameters:
        - name: level
          in: path
          required: true
          description: Merkle tree level (0-63)
          schema:
            type: integer
            minimum: 0
            maximum: 63
        - name: index
          in: path
          required: true
          description: Tile index (nested format like x001/x234/067)
          schema:
            type: string
      responses:
        '200':
          description: Tile retrieved successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=31536000, immutable"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Raw tile data (256 hashes × 32 bytes for full tiles)
        '404':
          description: Tile not found
          content:
            text/plain:
              schema:
                type: string

  /tile/entries/{index}:
    get:
      summary: Get Entry Tile
      description: |
        Get an entry tile (bundle) from the transparency log.
        Contains raw entry hashes for the specified tile index.
      tags:
        - Transparency Log
      parameters:
        - name: index
          in: path
          required: true
          description: Entry tile index (nested format like x001/x234/067)
          schema:
            type: string
      responses:
        '200':
          description: Entry tile retrieved successfully
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=31536000, immutable"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Raw entry tile data (up to 256 hashes × 32 bytes)
        '404':
          description: Entry tile not found
          content:
            text/plain:
              schema:
                type: string

  /statements:
    get:
      summary: Query Statements
      description: |
        Query statement metadata with optional filters.
        Returns JSON array of statement metadata.
      tags:
        - Transparency Log
      parameters:
        - name: iss
          in: query
          description: Filter by issuer URL
          schema:
            type: string
            example: "https://issuer.example.com"
        - name: sub
          in: query
          description: Filter by subject
          schema:
            type: string
        - name: cty
          in: query
          description: Filter by content type
          schema:
            type: string
            example: "application/json"
        - name: typ
          in: query
          description: Filter by type
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results (default 100, max 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Statements retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statements:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatementMetadata'
                  limit:
                    type: integer
                    example: 100
                  offset:
                    type: integer
                    example: 0
                  total:
                    type: integer
                    example: 42
        '500':
          description: Failed to query statements
          content:
            text/plain:
              schema:
                type: string

    post:
      summary: Register Statement (Alternative)
      description: |
        Register a new COSE Sign1 statement in the transparency log.
        Alternative endpoint to POST /entries with the same behavior.

        Supports both application/cose and application/scitt-statement+cose content types.
      tags:
        - Transparency Log
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/cose:
            schema:
              type: string
              format: binary
              description: CBOR-encoded COSE Sign1 structure
          application/scitt-statement+cose:
            schema:
              type: string
              format: binary
              description: CBOR-encoded COSE Sign1 SCITT statement
      responses:
        '201':
          description: Statement registered successfully - returns COSE Sign1 receipt
          content:
            application/scitt-receipt+cose:
              schema:
                type: string
                format: binary
                description: CBOR-encoded COSE Sign1 receipt with Merkle inclusion proof
        '400':
          description: Invalid request (malformed COSE Sign1 or validation failure)
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized (missing or invalid API key)
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: Unsupported Media Type
          content:
            text/plain:
              schema:
                type: string

  /statements/{entry_id}/receipt:
    get:
      summary: Get Receipt (Alternative)
      description: |
        Retrieve a transparency receipt for a registered statement.
        Alternative endpoint to GET /entries/{entry_id} with the same behavior.
      tags:
        - Transparency Log
      parameters:
        - name: entry_id
          in: path
          required: true
          description: Entry ID of the registered statement
          schema:
            type: integer
            format: int64
            example: 42
      responses:
        '200':
          description: Receipt retrieved successfully
          content:
            application/scitt-receipt+cose:
              schema:
                type: string
                format: binary
                description: CBOR-encoded COSE Sign1 receipt with Merkle inclusion proof
        '404':
          description: Statement not found
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid entry ID format
          content:
            text/plain:
              schema:
                type: string

  /entries:
    post:
      summary: Register Statement
      description: |
        Register a new COSE Sign1 statement in the transparency log.
        The statement will be assigned an entry ID and included in the Merkle tree.

        Supports both application/cose and application/scitt-statement+cose content types.
      tags:
        - SCITT Reference APIs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/cose:
            schema:
              type: string
              format: binary
              description: CBOR-encoded COSE Sign1 structure
          application/scitt-statement+cose:
            schema:
              type: string
              format: binary
              description: CBOR-encoded COSE Sign1 SCITT statement
      responses:
        '201':
          description: Statement registered successfully - returns COSE Sign1 receipt
          content:
            application/scitt-receipt+cose:
              schema:
                type: string
                format: binary
                description: CBOR-encoded COSE Sign1 receipt with Merkle inclusion proof
        '400':
          description: Invalid request (malformed COSE Sign1 or validation failure)
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized (missing or invalid API key)
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: Unsupported Media Type
          content:
            text/plain:
              schema:
                type: string

  /entries/{entry_id}:
    get:
      summary: Get Receipt
      description: |
        Retrieve a transparency receipt for a registered statement.
        The receipt contains a Merkle inclusion proof and signed checkpoint.
      tags:
        - SCITT Reference APIs
      parameters:
        - name: entry_id
          in: path
          required: true
          description: Entry ID of the registered statement
          schema:
            type: integer
            format: int64
            example: 42
      responses:
        '200':
          description: Receipt retrieved successfully
          content:
            application/scitt-receipt+cose:
              schema:
                type: string
                format: binary
                description: CBOR-encoded COSE Sign1 receipt with Merkle inclusion proof
        '404':
          description: Statement not found
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid entry ID format
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key authentication using Bearer token

  schemas:
    StatementMetadata:
      type: object
      properties:
        entry_id:
          type: integer
          format: int64
          description: Unique entry ID in the log
          example: 42
        leaf_hash:
          type: string
          description: Hex-encoded leaf hash stored in the tile
          example: "a1b2c3d4..."
        iss:
          type: string
          description: Issuer URL
          example: "https://issuer.example.com"
        sub:
          type: string
          description: Subject (optional)
          example: "artifact-123"
        cty:
          type: string
          description: Content type (optional)
          example: "application/json"
        typ:
          type: string
          description: Type (optional)
          example: "application/example"
        payload_hash_alg:
          type: integer
          description: Hash algorithm identifier
          example: -16
        payload_hash:
          type: string
          description: Hex-encoded payload hash
          example: "9f8e7d6c..."
        payload_location:
          type: string
          description: Payload location (optional)
          example: "https://example.com/payload"
        registered_at:
          type: string
          format: date-time
          description: Registration timestamp (ISO 8601)
          example: "2023-10-18T12:00:00Z"

    RegisterStatementResponse:
      type: object
      properties:
        entry_id:
          type: integer
          format: int64
          description: Unique identifier for the registered statement
        statement_hash:
          type: string
          description: SHA-256 hash of the statement (hex-encoded)

    ServiceConfiguration:
      type: object
      properties:
        issuer:
          type: string
          description: Service issuer URL
        supported_algorithms:
          type: array
          items:
            type: string
          description: Supported signing algorithms
        supported_hash_algorithms:
          type: array
          items:
            type: string
          description: Supported hash algorithms
        registration_policy:
          type: object
          properties:
            type:
              type: string
              description: Registration policy type

    HealthResponse:
      type: object
      properties:
        status:
          type: string
        issuer:
          type: string
