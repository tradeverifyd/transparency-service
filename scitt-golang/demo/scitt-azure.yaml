# SCITT Transparency Service Configuration
# Azure Blob Storage + MongoDB (Azure Cosmos DB)
# Secrets loaded from .env file

issuer: http://127.0.0.1:56177

database:
  type: mongodb
  mongodb:
    uri: ${SCITT_MONGODB_URI}
    database: ${SCITT_MONGODB_DATABASE}

storage:
  type: azure
  azure:
    container: scitt-tiles
    sas_url: ${SCITT_AZURE_BLOB_SAS_URL}

# Keys are generated by the scitt issuer key generate command
# In production setting these would point to azure key vault
keys:
  private: ./demo/priv.cbor
  public: ./demo/pub.cbor

server:
  host: 127.0.0.1
  port: 56177
  api_key: ${SCITT_API_KEY}
  cors:
    enabled: true
    allowed_origins:
      - "*"
